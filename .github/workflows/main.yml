name: Astra CI

on:
  push:
    branches:
      - astra-starter
      - scopeledger
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.node == 'true'
        run: npm ci --ignore-scripts

      - name: Lint
        if: steps.detect.outputs.node == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.detect.outputs.node == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.detect.outputs.node == 'true'
        run: npm test

      - name: Production build
        if: steps.detect.outputs.node == 'true'
        run: npm run build

      - name: Secret-file sanity check
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Potential secret-bearing files are tracked:"
            echo "$forbidden"
            exit 1
          fi
          echo "No obvious secret-bearing files tracked."
